[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-rag-assistant"
version = "1.0.0"
description = "Agentic RAG system for financial document analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["rag", "langchain", "langgraph", "finance", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core LLM & Agent Framework
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",

    # Vector Store & Embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.1.0",
    "qdrant-client>=1.11.0",

    # Sparse Retrieval
    "rank-bm25>=0.2.2",

    # Document Processing
    "sec-edgar-downloader>=5.0.0",
    "pypdf>=4.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # Data & ML
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "datasets>=3.0.0",

    # Evaluation
    "ragas>=0.2.0",

    # API & UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "streamlit>=1.39.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",

    # Observability
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "yfinance>=0.2.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "setuptools>=68",
]
full = [
    "unstructured[pdf]>=0.15.0",   # Optional: advanced PDF/HTML parsing
]

[project.scripts]
finsight-ingest = "scripts.ingest_pipeline:main"
finsight-eval = "scripts.run_evaluation:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
