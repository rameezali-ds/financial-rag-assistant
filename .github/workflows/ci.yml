name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint + Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check src/ api/ app/ scripts/

      - name: Run MyPy type checker
        run: mypy src/ --ignore-missing-imports

  # Job 2: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # Job 3: RAGAs Evaluation Gate
  eval-gate:
    name: Evaluation Quality Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest sample data
        run: python scripts/ingest_pipeline.py --use-sample-data

      - name: Run evaluation (mini set)
        run: |
          python scripts/run_evaluation.py \
            --output results/ci_eval.csv \
            2>&1 | tee eval_output.txt

      - name: Check faithfulness threshold
        run: |
          python -c "
          import json, sys
          import pandas as pd
          df = pd.read_csv('results/ci_eval.csv')
          faithfulness = df['faithfulness'].mean()
          print(f'Mean faithfulness: {faithfulness:.3f}')
          if faithfulness < 0.70:
              print('FAILED: faithfulness below threshold 0.70')
              sys.exit(1)
          print('PASSED: faithfulness above threshold')
          "

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/ci_eval.csv

  # Job 4: Docker Build + Push
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finsight-rag:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finsight-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
